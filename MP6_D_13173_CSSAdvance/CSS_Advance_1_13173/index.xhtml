<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Kompetisi</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div id="wrapper">
        <h1>Formulir Registrasi Kompetisi</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td>
                        <label for="namatim"><strong>Nama Tim Pendaftar</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namatim" name="namatim" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="ketua"><strong>Nama Perwakilan / Ketua Kelompok</strong></label>
                    </td>
                    <td>
                        <input type="text" id="ketua" name="ketua" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="jumlah"><strong>Total Anggota Tim</strong></label>
                    </td>
                    <td>
                        <select id="jumlah" name="jumlah">
                            <option>1 Orang</option>
                            <option>2 Orang</option>
                            <option>3 Orang</option>
                            <option>4 Orang</option>
                            <option>5 Orang</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="telepon"><strong>Nomor Kontak Perwakilan Tim Pendaftar</strong></label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="universitas">
                            <strong>Institusi Asal</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="universitas" name="universitas" size="30" />
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <strong>Kategori Kompetisi</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="coding" name="bidang" 
                                    value="Coding" />
                            <label for="coding">Pemrograman Kompetitif</label>
                            <input type="checkbox" id="desain" name="bidang" 
                                    value="Desain" />
                            <label for="desain">Desain Grafis</label>
                        </p>
                        <p>
                            <input type="checkbox" id="video" name="bidang" 
                                    value="Video" />
                            <label for="video">Videografi</label>
                            <input type="checkbox" id="essay" name="bidang" 
                                    value="Essay" />
                            <label for="essay">Penulisan Karya Tulis Ilmiah</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Klasifikasi Peserta</strong>
                    </td>
                    <td>
                        <input type="radio" id="mahasiswa" name="peserta" 
                                value="Mahasiswa" />
                        <label for="mahasiswa">Kategori Mahasiswa</label>
                        <input type="radio" id="umum" name="peserta" 
                                value="Umum" />
                        <label for="umum">Kategori Umum</label>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <label for="deskripsi"><strong>Penjelasan Karya</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi" 
                                    rows="10" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <label for="alasan">
                            <strong>Motivasi Pendaftaran</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" 
                                    rows="7" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="filekarya"><strong>Unggah Dokumen</strong></label>
                    </td>
                    <td>
                        <input type="file" id="filekarya" name="filekarya" 
                                accept="application/pdf, image/jpeg, image/png" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="daftar" value="Kirim Formulir Registrasi" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
