<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Acara</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div id="wrapper">
        <h1>Formulir Registrasi Acara</h1>
        <form action="" method="post" enctype="multipart/form-data">
            
            <h2>Identitas Peserta</h2>
            <table>
                <tr>
                    <td>
                        <label for="nama"><strong>Nama Lengkap Peserta</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="nim"><strong>Nomor Pokok Mahasiswa / Nomor Induk Mahasiswa</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="prodi"><strong>Program Studi Peserta</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Gender</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-laki" />
                        <label for="laki">Pria</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Wanita</label>
                    </td>
                </tr>
            </table>

            <h2>Preferensi Acara</h2>
            <table>
                <tr>
                    <td>
                        <strong>Kategori Acara</strong>
                    </td>
                    <td>
                        <input type="radio" id="seminar" name="kegiatan" value="Seminar" />
                        <label for="seminar">Simposium</label>
                        <input type="radio" id="pelatihan" name="kegiatan" value="Pelatihan" />
                        <label for="pelatihan">Workshop</label>
                        <input type="radio" id="diskusi" name="kegiatan" value="Diskusi" />
                        <label for="diskusi">Diskusi Ilmiah</label>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <strong>Fokus Peminatan</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="teknologi" name="minat" value="Teknologi" />
                            <label for="teknologi">Teknologi / Riset dan Penelitan</label>
                        </p>
                        <p>
                            <input type="checkbox" id="organisasi" name="minat" value="Organisasi" />
                            <label for="organisasi">Kepemimpinan dan Organisasi</label>
                        </p>
                        <p>
                            <input type="checkbox" id="karier" name="minat" value="Karier" />
                            <label for="karier">Pengembangan Karier</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="waktu"><strong>Preferensi Waktu</strong></label>
                    </td>
                    <td>
                        <select id="waktu" name="waktu">
                            <option>Sesi Pagi</option>
                            <option>Sesi Siang</option>
                            <option>Sesi Sore</option>
                        </select>
                    </td>
                </tr>
            </table>

            <h2>Persyaratan Administrasi Untuk Pendaftaran</h2>
            <table>
                <tr>
                    <td style="vertical-align:top;">
                        <label for="harapan"><strong>Alasan Pendaftaran Kegiatan</strong></label>
                    </td>
                    <td>
                        <textarea id="harapan" name="harapan" rows="7" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="bukti"><strong>Struk / Bukti Transfer</strong></label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti" accept="application/pdf, image/jpeg, image/png" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="kirim" value="Kirim Formulir Registrasi" />
                    </td>
                </tr>
            </table>
            
        </form>
    </div>
</body>
</html>
